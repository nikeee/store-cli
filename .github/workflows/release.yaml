name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - run: go test -race ./...
      - uses: ./.github/actions/goreleaser
        with:
          args: release --clean
          token: ${{ secrets.GITHUB_TOKEN }}
