name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Generated code is up to date
        run: go generate ./... && git diff --exit-code
      - name: No en or em dashes in the docs
        run: "! grep -rnP '[\\x{2013}\\x{2014}]' docs skills README.md action.yml"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go test -race ./...

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/goreleaser
        with:
          args: check
      - uses: ./.github/actions/goreleaser
        with:
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v4
        with:
          name: store-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  setup-action:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: first
        uses: ./
        with:
          version: 0.1.0
      - id: second
        uses: ./
        with:
          version: v0.1.0
      - name: store is on the PATH, the second run came from the tool cache
        run: |
          store version -o json | grep -q '"version": "0.1.0"'
          test "${{ steps.first.outputs.version }}" = 0.1.0
          test "${{ steps.first.outputs.cache-hit }}" = false
          test "${{ steps.second.outputs.cache-hit }}" = true
      - id: latest
        uses: ./
      - run: test -n "${{ steps.latest.outputs.version }}"
